<style id="site-style">
/* Layout: one 1040px column on white with pale-blue bands. Rules (1px lines) separate content; only two elements get a border:
   the quick-facts sheet in the hero and the featured project. Single light theme by design. */
:root {
  color-scheme: light;
  /* color */
  --bg: #ffffff;
  --tint: #eef4fc;        /* pale blue bands: hero, featured project, contact */
  --surface: #ffffff;
  --fg: #13213a;          /* navy ink */
  --muted: #56637a;
  --line: #dde5f0;
  --accent: #1d5bbf;      /* blue: links, numbers, active states, primary button */
  --copper: #9c7425;      /* Tech gold: specs, formula, LED only */
  --on-accent: #ffffff;
  --grid: rgba(29, 91, 191, 0.07);
  --footer-bg: #13213a;
  --footer-fg: #c9d6ea;
  /* type */
  --font-display: "Times New Roman", Tinos, Times, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-xs: 0.8125rem;   /* 13 */
  --fs-sm: 0.9375rem;   /* 15 */
  --fs-md: 1.0625rem;   /* 17 */
  --fs-lg: 1.25rem;     /* 20 */
  --fs-xl: 1.625rem;    /* 26 */
  --fs-2xl: clamp(2.125rem, 4.6vw, 3rem); /* 34-48 */
  --lh-body: 1.6;
  --lh-head: 1.2;
  --w-regular: 400; --w-medium: 500; --w-bold: 600;
  /* spacing */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 80px;
  /* radius */
  --r-sm: 0; --r-md: 0;   /* square corners throughout */
  /* motion */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur: 200ms;
  --lift: -2px;
  --maxw: 1040px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--fs-md); line-height: var(--lh-body); font-weight: var(--w-regular);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); line-height: var(--lh-head); margin: 0; text-wrap: balance; color: var(--fg); }
h1 { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: var(--fs-xl); font-weight: var(--w-bold); }
h3 { font-size: var(--fs-lg); font-weight: var(--w-bold); }
p { margin: 0; }
ul { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-body); }
.muted { color: var(--muted); }
.spec { font-family: var(--font-display); font-style: italic; font-size: var(--fs-md); color: var(--copper); }
.keywords { font-size: var(--fs-sm); color: var(--muted); }

/* nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); padding-block: var(--s3); position: relative; }
.brand { font-family: var(--font-display); font-weight: var(--w-bold); font-size: var(--fs-md); color: var(--fg); text-decoration: none; }
.nav-links { display: flex; gap: var(--s5); align-items: center; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: var(--fs-sm); font-weight: var(--w-medium); transition: color var(--dur) var(--ease); }
.nav-links a:hover { color: var(--fg); }
.btn.menu-btn { display: none; }
@media (max-width: 1060px) {
  .btn.menu-btn { display: inline-flex; }
  .nav-links { position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; align-items: stretch; gap: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: var(--s2) max(16px, env(safe-area-inset-right, 0px)) var(--s3) max(16px, env(safe-area-inset-left, 0px)); }
  .nav-links a { padding-block: var(--s3); font-size: var(--fs-md); }
  .nav-links:not(.open) { display: none; }
}

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); font: var(--w-medium) var(--fs-sm)/1 var(--font-body); padding: 11px 18px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; cursor: pointer; transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.btn:hover { transform: translateY(var(--lift)); border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.small { padding: 7px 12px; font-size: var(--fs-xs); }
.btn[disabled] { opacity: 0.6; cursor: progress; transform: none; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* hero */
.hero { background: var(--tint); }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s7); padding-block: var(--s8) var(--s7); align-items: start; }
.hero-copy { display: grid; gap: var(--s4); min-width: 0; }
.tagline { font-size: var(--fs-sm); color: var(--muted); font-weight: var(--w-medium); }
.hero-copy .intro { font-size: var(--fs-lg); color: var(--muted); max-width: 38ch; line-height: 1.5; }
.hero-actions { display: flex; flex-wrap: wrap; gap: var(--s3); padding-top: var(--s2); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); min-width: 0; }
.sheet dl { margin: 0; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.7fr); }
.sheet dt, .sheet dd { margin: 0; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); }
.sheet dt { color: var(--muted); }
.sheet dl > :nth-last-child(-n+2) { border-bottom: 0; }
@media (max-width: 820px) { .hero .wrap { grid-template-columns: 1fr; gap: var(--s6); padding-block: var(--s7) var(--s6); } }

/* sections */
section.block { border-top: 1px solid var(--line); }
section.block > .wrap { padding-block: var(--s7); display: grid; gap: var(--s5); }
.sec-head { display: grid; gap: var(--s2); }
.sec-head p { color: var(--muted); font-size: var(--fs-sm); }
footer { background: var(--footer-bg); }
footer a { color: var(--footer-fg); }
footer .wrap { padding-block: var(--s6); font-size: var(--fs-sm); color: var(--footer-fg); display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s3); }

/* about */
.about { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); grid-template-areas: "photo text" "interests edu"; gap: var(--s6) var(--s7); align-items: start; }
.about > .portrait { grid-area: photo; }
.about > .interests { grid-area: interests; }
.about > .about-text { grid-area: text; }
.about > .edu-block { grid-area: edu; }

.edu-block { display: grid; gap: var(--s4); padding-top: var(--s5); border-top: 1px solid var(--line); scroll-margin-top: 72px; min-width: 0; }
.about-heading { font-size: var(--fs-xl); }
.interests { padding-top: var(--s5); border-top: 1px solid var(--line); }
.interests .about-heading { margin-bottom: var(--s4); }
.about-heading + .interest { border-top: 0; padding-top: 0; }
.about-text { display: grid; gap: var(--s4); max-width: 65ch; align-content: start; }
.portrait { display: grid; gap: var(--s3); margin: 0; }
.portrait img { width: 100%; max-width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 20%; border-radius: var(--r-md); display: block; background: var(--line); }
.interests { display: grid; align-content: start; text-align: left; }

.interest { padding-block: var(--s3); border-top: 1px solid var(--line); display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--s3); align-items: start; }
.interest-text { display: grid; gap: 2px; min-width: 0; }
.icon-tile { width: 36px; height: 36px; border-radius: var(--r-md); background: var(--tint); color: var(--accent); display: grid; place-items: center; }
.icon-tile svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.interest h3 { font-size: var(--fs-md); }
.interest p { font-size: var(--fs-sm); color: var(--muted); }
@media (max-width: 820px) { .about { grid-template-columns: 1fr; grid-template-areas: "photo" "text" "interests" "edu"; gap: var(--s5); } .portrait { max-width: 320px; } }

/* project filters: text tabs with an underline for the active one */
.filters { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s5); border-bottom: 1px solid var(--line); }
.tab { font: var(--w-medium) var(--fs-sm)/1 var(--font-body); padding: var(--s3) 0; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.tab:hover { color: var(--fg); }
.tab[aria-pressed="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.count { font-size: var(--fs-xs); color: var(--muted); margin-left: 6px; }

/* featured project: the one bordered block in the list */
.featured { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); padding: var(--s6); background: var(--tint); border: 1px solid var(--line); border-radius: var(--r-md); }
.featured.has-photo { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
.gallery { display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.g-main { position: relative; width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: #ffffff; }
.g-open { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.g-open img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 500ms var(--ease); }
.g-open img.contain { object-fit: contain; padding: var(--s3); }

.g-open:hover img:not(.contain) { transform: scale(1.03); }
.g-arrow { position: absolute; top: 50%; width: 40px; height: 40px; margin-top: -20px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 0; background: rgba(255, 255, 255, 0.92); color: var(--fg); cursor: pointer; box-shadow: 0 2px 10px rgba(19, 33, 58, 0.18); transition: background var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.g-arrow:hover { background: var(--accent); color: var(--on-accent); }
.g-arrow.prev { left: var(--s3); }
.g-arrow.next { right: var(--s3); }
.g-arrow.prev:active { transform: translateX(-2px); }
.g-arrow.next:active { transform: translateX(2px); }
.arrow-chev { width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; }
.g-arrow.prev .arrow-chev { transform: translateX(2px) rotate(135deg); }
.g-arrow.next .arrow-chev { transform: translateX(-2px) rotate(-45deg); }
.g-count { position: absolute; right: var(--s3); bottom: var(--s3); padding: 3px 8px; border-radius: var(--r-sm); background: rgba(19, 33, 58, 0.72); color: #ffffff; font-size: var(--fs-xs); font-variant-numeric: tabular-nums; pointer-events: none; }
.g-cap { font-size: var(--fs-xs); color: var(--muted); line-height: 1.45; }
@media (prefers-reduced-motion: no-preference) { .g-open img.fade-in { animation: fadein 400ms var(--ease); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.featured h3 { font-size: var(--fs-xl); }
.featured:not(.has-photo) .p-points { columns: 2; column-gap: var(--s6); display: block; }
.featured:not(.has-photo) .p-points li { break-inside: avoid; margin-bottom: var(--s2); }
@media (max-width: 760px) { .featured:not(.has-photo) .p-points { columns: 1; } }
.featured .summary { font-size: var(--fs-md); max-width: 60ch; }
.p-body { display: grid; gap: var(--s3); min-width: 0; }
.p-meta { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
.p-meta .state-current { color: var(--accent); }
.p-org { font-size: var(--fs-sm); color: var(--muted); }
.summary { font-size: var(--fs-sm); }
.photo { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); display: block; }
@media (max-width: 760px) { .featured, .featured.has-photo { grid-template-columns: 1fr; padding: var(--s5); } }

/* other projects: ruled rows */
.p-list { display: grid; }
.p-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 220px); gap: var(--s5); padding-block: var(--s5); border-bottom: 1px solid var(--line); }
.p-row:first-child { border-top: 1px solid var(--line); }
.p-row .photo { aspect-ratio: 4 / 3; }
.p-row.has-photo { align-items: stretch; }
.p-row:not(.has-photo) { grid-template-columns: minmax(0, 1fr); }
/* photo column stretches to the height of the text beside it */
.media-stack { display: grid; gap: var(--s3); grid-auto-rows: minmax(180px, 1fr); min-width: 0; }
.media-stack:has(> :nth-child(4)) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.media { position: relative; margin: 0; min-height: 180px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 500ms var(--ease); }
article:hover .media img { transform: scale(1.03); }
.media img.contain { object-fit: contain; background: #ffffff; padding: var(--s2) var(--s2) 36px; }
article:hover .media img.contain { transform: none; }
.media figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--s2) var(--s3); font-size: var(--fs-xs); line-height: 1.4; color: var(--fg); background: rgba(255, 255, 255, 0.92); }
.media-open { position: absolute; inset: 0; padding: 0; border: 0; background: none; cursor: zoom-in; display: block; width: 100%; height: 100%; }
.media-remove { position: absolute; top: var(--s2); right: var(--s2); }
.p-points { padding-left: 1.1em; display: grid; gap: var(--s2); font-size: var(--fs-sm); }
.p-points li::marker { color: var(--accent); }
.skills-gained { font-size: var(--fs-sm); line-height: 1.5; }
.skills-gained strong { font-weight: var(--w-bold); color: var(--fg); }
.sg-label { color: var(--muted); }
.more-btn { justify-self: start; display: inline-flex; align-items: center; gap: var(--s2); padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); color: var(--accent); font: var(--w-medium) var(--fs-sm)/1 var(--font-body); cursor: pointer; transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.more-btn:hover { border-color: var(--accent); transform: translateY(var(--lift)); }
.chev { width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform var(--dur) var(--ease); }
.more-btn[aria-expanded="true"] .chev { transform: translateY(2px) rotate(-135deg); }
@media (prefers-reduced-motion: no-preference) { .p-points.reveal { animation: reveal 260ms var(--ease); } }
@keyframes reveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.viewer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(19, 33, 58, 0.9);
  padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.viewer figure { margin: 0; display: grid; gap: var(--s3); justify-items: center; max-width: 100%; max-height: 100%; }
.viewer img { max-width: min(1200px, 100%); max-height: calc(100vh - 140px); object-fit: contain; border-radius: var(--r-sm); }
.viewer figcaption { color: #e6edf8; font-size: var(--fs-sm); text-align: center; max-width: 70ch; }
.viewer-close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
@media (max-width: 760px) { .media-stack { grid-auto-rows: auto; } .media { min-height: 0; aspect-ratio: 4 / 3; } }
.p-row h3 { font-size: var(--fs-lg); }
@media (max-width: 640px) { .p-row { grid-template-columns: 1fr; } }
.empty { padding: var(--s6) 0; color: var(--muted); font-size: var(--fs-sm); }

/* hero stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4) var(--s5); padding-top: var(--s5); margin-top: var(--s3); border-top: 1px solid var(--line); }
.stat { display: grid; gap: 2px; align-content: start; }
.stat b { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: var(--w-bold); color: var(--accent); font-variant-numeric: lining-nums tabular-nums; line-height: 1.1; }
.stat span { font-size: var(--fs-sm); color: var(--muted); line-height: 1.4; }

@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* schematic strip */
.circuit-fig { margin: 0; display: grid; gap: var(--s3); padding: var(--s5); border: 1px solid var(--line); border-radius: var(--r-md);
  background-color: var(--surface);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px; }
.circuit-title { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: var(--w-bold); }
.circuit-scroll { overflow-x: auto; }
.circuit svg { display: block; width: 100%; min-width: 680px; height: auto; }
.circuit figcaption { font-size: var(--fs-sm); color: var(--muted); max-width: 70ch; }
.circuit-scroll { background: rgba(255, 255, 255, 0.6); }
.circuit .w { fill: none; stroke: var(--fg); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.circuit .node { fill: var(--fg); }
.circuit .lbl { font-family: var(--font-body); font-size: 13px; fill: var(--muted); }
.circuit .ic { font-family: var(--font-display); font-size: 22px; font-weight: 600; fill: var(--fg); }
.circuit .formula { font-family: var(--font-display); font-style: italic; font-size: 19px; fill: var(--copper); }
.circuit .pulse { fill: var(--accent); }
.circuit .led { fill: var(--copper); }

/* timeline */
.timeline { display: grid; }
.entry { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: var(--s5); padding-block: var(--s5); border-top: 1px solid var(--line); }
.entry .when { font-size: var(--fs-sm); color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
.entry-body { display: grid; gap: var(--s2); min-width: 0; position: relative; padding-left: var(--s5); border-left: 2px solid var(--line); }
.entry-body::before { content: ""; position: absolute; left: -8px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.entry:first-child .entry-body::before { background: var(--accent); }
.entry-body .org { color: var(--accent); font-weight: var(--w-medium); font-size: var(--fs-sm); }
.entry-body ul { padding-left: 1.1em; display: grid; gap: var(--s1); font-size: var(--fs-sm); }
.entry-body .desc { font-size: var(--fs-sm); color: var(--muted); }
@media (max-width: 640px) { .entry { grid-template-columns: 1fr; gap: var(--s2); } }

/* skills: label / list rows */
.rows { display: grid; }
.row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: var(--s5); padding-block: var(--s4); border-top: 1px solid var(--line); }
.row:last-child { border-bottom: 1px solid var(--line); }
.row h3 { font-size: var(--fs-md); }
.row p { font-size: var(--fs-sm); }
@media (max-width: 640px) { .row { grid-template-columns: 1fr; gap: var(--s1); } }

/* education */
.edu { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--s6); }
.edu-col { display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.edu-col .label { font-size: var(--fs-sm); color: var(--muted); font-weight: var(--w-medium); margin-top: var(--s3); }
.edu-col ul { padding-left: 1.1em; display: grid; gap: var(--s1); font-size: var(--fs-sm); }
.school { display: flex; align-items: center; gap: var(--s4); }
.school img { width: 64px; height: 64px; object-fit: contain; flex: none; }
.edu-col .org { color: var(--accent); font-weight: var(--w-medium); font-size: var(--fs-sm); }
.kv { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s5); font-size: var(--fs-sm); color: var(--muted); }
@media (max-width: 720px) { .edu { grid-template-columns: 1fr; gap: var(--s5); } }

/* resume */
.resume { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s5); justify-items: start; }
.resume > .resume-page { width: 100%; max-width: 800px; }
.resume-page { position: relative; margin: 0; aspect-ratio: 8.5 / 11; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: #ffffff; box-shadow: 0 8px 28px rgba(19, 33, 58, 0.10); transition: transform var(--dur) var(--ease); }
.resume-page:hover { transform: translateY(var(--lift)); }
.resume-page img { width: 100%; height: 100%; object-fit: contain; display: block; }
.resume-info { display: grid; gap: var(--s4); align-content: start; max-width: 52ch; }
.resume-info .hero-actions { padding-top: 0; }


/* contact */
#contact { background: var(--tint); }
.contact { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: var(--s7); align-items: start; }
.contact-col { display: grid; gap: var(--s3); min-width: 0; align-content: start; }
.contact-col .label { font-size: var(--fs-sm); color: var(--muted); font-weight: var(--w-medium); }
.email-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); }
.email { font-family: var(--font-display); font-size: var(--fs-lg); user-select: all; overflow-wrap: anywhere; }
.links { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: var(--s3); }
.links a { display: grid; gap: 2px; justify-items: center; text-align: center; padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); text-decoration: none; color: var(--fg); transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.links a:hover { transform: translateY(var(--lift)); border-color: var(--accent); }
.links a span:first-child { font-weight: var(--w-bold); font-size: var(--fs-md); }
.links a span:last-child { font-size: var(--fs-xs); color: var(--muted); overflow-wrap: anywhere; }
.toast { font-size: var(--fs-xs); color: var(--accent); }
.relocate { font-weight: var(--w-bold); color: var(--accent); }
@media (max-width: 720px) { .contact { grid-template-columns: 1fr; gap: var(--s5); } }

/* edit mode */
.editbar { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; justify-content: flex-end; padding: var(--s2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: 0 6px 24px rgba(19, 33, 58, 0.14); max-width: calc(100vw - 32px); }
.editbar .note { font-size: var(--fs-xs); color: var(--muted); padding-inline: var(--s2); }
.editbar .note.err { color: var(--copper); }
body.editing [data-path], body.editing [data-csv] { outline: 1px dashed rgba(29, 91, 191, 0.5); outline-offset: 3px; border-radius: var(--r-sm); cursor: text; min-width: 2ch; }
body.editing [data-path]:focus, body.editing [data-csv]:focus { outline: 2px solid var(--accent); }
.csv-label { font-family: var(--font-body); font-size: var(--fs-xs); color: var(--muted); }
.item-tools { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.item-tools select { font: var(--w-regular) var(--fs-xs) var(--font-body); padding: 5px 8px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-msg { font-size: var(--fs-xs); color: var(--muted); }
.upload-msg.err { color: var(--copper); }
.add-btn { justify-self: start; }

      editing ? h("div", { "class": "item-tools" }, [h("span", { "class": "csv-label", text: "Filter category:" }), t("span", base + ".category", "keywords")]) : null,
      tools("projects", i, [statusSel].concat(addPhotoTools(p, i)))
    ]);
    var cls = (featured ? "featured" : "p-row") + (stack ? " has-photo" : "");
    return h("article", { "class": cls }, [body, stack]);
  }

  function projects() {
    var cats = ["All", "Current", "Past"];
    state.projects.forEach(function (p) { if (p.category && cats.indexOf(p.category) < 0) cats.push(p.category); });
    if (cats.indexOf(filter) < 0) filter = "All";
    function match(p, c) {
      if (c === "All") return true;
      if (c === "Current") return p.status === "current";
      if (c === "Past") return p.status === "past";
      return p.category === c;
    }
    var bar = h("div", { "class": "filters", role: "group", "aria-label": "Filter projects" });
    var area = h("div", { style: "display:grid;gap:24px" });
    cats.forEach(function (c) {
      var n = state.projects.filter(function (p) { return match(p, c); }).length;
      bar.appendChild(h("button", { "class": "tab", type: "button", "data-cat": c, "aria-pressed": String(c === filter), onclick: function () {
        filter = c;
        Array.prototype.forEach.call(bar.children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.cat === c)); });
        paint();
      } }, [c, h("span", { "class": "count", text: String(n) })]));
    });
    function paint() {
      galleryCleanups.forEach(function (f) { f(); }); galleryCleanups = [];
      area.innerHTML = "";
      var items = [];
      state.projects.forEach(function (p, i) { if (editing || match(p, filter)) items.push(i); });
      if (!items.length) { area.appendChild(h("p", { "class": "empty", text: "No projects in this category yet." })); return; }
      items.forEach(function (i) { area.appendChild(projectBlock(state.projects[i], i, true)); });
      var add = addBtn("projects", "project", { title: "New project", org: "Team or course", status: "current", category: "PCB Design", period: "2027", summary: "What you built and what it does.", spec: "Key spec", tags: ["Keyword"], image: "" });
      if (add) area.appendChild(add);
    }
    paint();
    var sub = editing ? "Use Move up to change the order of projects." : "A selection of my hardware work. Click any photo to see it full size, and open Show details for more information.";
    return section("projects", [secHead("projects", "Featured projects", sub), editing ? null : bar, area]);
  }

  function timeline(id, title, key, template) {
    var list = h("div", { "class": "timeline" });
    state[key].forEach(function (e, i) {
      var base = key + "." + i;
      var ul = h("ul");
      e.points.forEach(function (_, j) { ul.appendChild(t("li", base + ".points." + j)); });
      var body = h("div", { "class": "entry-body" }, [
        t("h3", base + ".role"),
        t("div", base + ".org", "org"),
        (e.desc || editing) ? t("p", base + ".desc", "desc") : null,
        ul,
        editing ? h("div", { "class": "item-tools" }, [
          addBtn(base + ".points", "bullet", "New bullet."),
          e.points.length ? h("button", { "class": "btn small", type: "button", text: "Remove last bullet", onclick: function () { removeItem(base + ".points", e.points.length - 1); } }) : null
        ]) : null,
        tools(key, i)
      ]);
      list.appendChild(h("div", { "class": "entry" }, [t("div", base + ".period", "when"), body]));
    });
    return section(id, [secHead(id, title), list, addBtn(key, "entry", template)]);
  }

  function skills() {
    var rows = h("div", { "class": "rows" });
    state.skills.forEach(function (g, i) {
      rows.appendChild(h("div", { "class": "row" }, [
        t("h3", "skills." + i + ".group"),
        h("div", {}, [editing ? csv("skills." + i + ".items", "Skills") : h("p", { text: g.items.join(", ") }), tools("skills", i)])
      ]));
    });
    return section("skills", [secHead("skills", "Skills"), rows, addBtn("skills", "skill group", { group: "New group", items: ["Skill"] })]);
  }

  function education() {
    var e = state.education;
    function list(arr, path) {
      if (editing) return csv(path, "Items");
      var ul = h("ul"); arr.forEach(function (x) { ul.appendChild(h("li", { text: x })); }); return ul;
    }
    var main = h("div", { "class": "edu-col" }, [
      h("div", { "class": "school" }, [state.eduLogo ? blobImg(state.eduLogo, "Georgia Tech logo") : null, h("div", {}, [t("h3", "education.school"), t("div", "education.degree", "org")])]),
      editing ? h("div", { "class": "item-tools" }, imageTools(state.eduLogo, "logo", function (id) { state.eduLogo = id; }, function () { state.eduLogo = ""; }, "edu")) : null,
      h("div", { "class": "kv" }, [t("span", "education.period", "mono"), t("span", "education.gpa")]),
      h("div", { "class": "label", text: "Relevant coursework" }),
      list(e.coursework, "education.coursework")
    ]);
    var orgs = h("div", { "class": "edu-col" }, [h("h3", { text: "Teams and organizations" }), list(e.orgs, "education.orgs")]);
    return h("div", { "class": "edu-block", id: "education" }, [h("h3", { "class": "about-heading", text: "Education" }), h("div", { "class": "edu" }, [main, orgs])]);
  }

  function resume() {
    var r = state.resume;
    if (!r || (!r.pdf && !editing)) return null;
    var msg = h("span", { "class": "upload-msg", role: "status", "aria-live": "polite" });
    var preview = null;
    if (r.preview) {
      var pic = blobImg(r.preview, "Resume of " + state.name + ", page 1");
      preview = editing ? h("figure", { "class": "resume-page" }, [pic])
        : h("figure", { "class": "resume-page" }, [h("button", { "class": "media-open", type: "button", "aria-label": "View resume larger", onclick: function () { openViewer(r.preview, ""); } }, [pic])]);
    }
    var actions = h("div", { "class": "hero-actions" });
    if (r.pdf && downloadsApi && !editing) {
      var dl = h("button", { "class": "btn primary", type: "button", text: "Download PDF" });
      dl.addEventListener("click", function () {
        dl.disabled = true; dl.textContent = "";
        dl.appendChild(h("span", { "class": "spinner", "aria-hidden": "true" })); dl.appendChild(document.createTextNode("Preparing…"));
        msg.className = "upload-msg"; msg.textContent = "";
        function reset() { dl.disabled = false; dl.textContent = "Download PDF"; }
        fetch(blobUrl(r.pdf)).then(function (res) { if (!res.ok) throw { code: "fetch" }; return res.blob(); })
          .then(function (blob) { return downloadsApi.save({ filename: (state.name || "Resume").replace(/\s+/g, "_") + "_Resume.pdf", data: blob }); })
          .then(function () { reset(); msg.textContent = "Saved."; }, function (err) {
            reset();
            var code = err && err.code;
            if (code === "declined") return;
            msg.className = "upload-msg err";
            msg.textContent = code === "rate_limited" ? "A save is already open. Finish it, then try again." : "Download isn't available here. Use Open PDF instead.";
          });
      });
      actions.appendChild(dl);
    }
    if (r.pdf && !editing && !downloadsApi) actions.appendChild(h("a", { "class": "btn primary", href: blobUrl(r.pdf), download: "Vinisha_Sisodia_Resume.pdf", text: "Download PDF" }));
    if (r.pdf && !editing) actions.appendChild(h("a", { "class": "btn", href: blobUrl(r.pdf), target: "_blank", rel: "noopener", text: "Open PDF" }));
    var info = h("div", { "class": "resume-info" }, [
      t("p", "resume.note"),
      actions, msg,
      editing ? h("div", { "class": "item-tools" }, imageTools(r.pdf, "PDF", function (id) { state.resume.pdf = id; }, function () { state.resume.pdf = ""; }, "rpdf", "application/pdf")) : null,
      editing ? h("div", { "class": "item-tools" }, imageTools(r.preview, "preview image", function (id) { state.resume.preview = id; }, function () { state.resume.preview = ""; }, "rprev")) : null,
      editing ? h("p", { "class": "upload-msg", text: "When you replace the PDF, also upload a screenshot of page 1 as the preview image." }) : null
    ]);
    return section("resume", [secHead("resume", "Resume"), h("div", { "class": "resume" }, [preview, info])]);
  }

  function contact() {
    var c = state.contact;
    /* one row per address, each with its own copy button */
    function emailRow(path) {
      var addr = getP(state, path);
      if (!addr && !editing) return null;
      var toast = h("span", { "class": "toast", role: "status", "aria-live": "polite" });
      var emailEl = t("span", path, "email");
      function selectEmail() { var r = document.createRange(); r.selectNodeContents(emailEl); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast.textContent = "Selected. Press Ctrl or Cmd + C to copy."; }
      var copyBtn = editing ? null : h("button", { "class": "btn small", type: "button", text: "Copy", "aria-label": "Copy " + addr, onclick: function () {
        try {
          navigator.clipboard.writeText(addr).then(function () {
            toast.textContent = "Copied"; setTimeout(function () { toast.textContent = ""; }, 1800);
          }, selectEmail);
        } catch (err) { selectEmail(); }
      } });
      return h("div", { "class": "email-row" }, [emailEl, copyBtn, toast]);
    }
    var left = h("div", { "class": "contact-col" }, [
      h("div", { "class": "label", text: "Email" }),
      emailRow("contact.email"),
      emailRow("contact.email2"),
      h("div", { "class": "label", text: "Location" }),
      t("div", "contact.location"),
      t("div", "contact.relocation", "relocate")
    ]);
    var links = h("div", { "class": "links" });
    c.links.forEach(function (l, i) {
      if (editing) {
        links.appendChild(h("div", { "class": "item-tools", style: "padding-block:8px" }, [t("span", "contact.links." + i + ".label"), t("span", "contact.links." + i + ".url", "keywords")]));
        links.appendChild(tools("contact.links", i));
      } else if (/^https?:\/\/.+\..+/.test(l.url)) {
        var host = l.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
        links.appendChild(h("a", { href: l.url, target: "_blank", rel: "noopener" }, [h("span", { text: l.label }), h("span", { text: host })]));
      }
    });
    var hasLinks = c.links.some(function (l) { return /^https?:\/\/.+\..+/.test(l.url); });
    var right = (hasLinks || editing) ? h("div", { "class": "contact-col" }, [
      h("div", { "class": "label", text: "Connect online" }), links,
      addBtn("contact.links", "link", { label: "LinkedIn", url: "https://www.linkedin.com/in/" })
    ]) : null;
    return section("contact", [
      h("div", { "class": "sec-head" }, [h("h2", { id: "contact-title" }, []), t("p", "contact.text")]),
      h("div", { "class": "contact" }, [left, right])
    ]);
  }

  function footer() {
    return h("footer", {}, [h("div", { "class": "wrap" }, [t("span", "footer"), h("a", { href: "#top", text: "Back to top" })])]);
  }

  /* ---------- edit bar ---------- */
  function editbar() {
    if (!canEdit) return null;
    if (!editing) {
      return h("div", { "class": "editbar" }, [h("button", { "class": "btn primary small", type: "button", text: "Edit site", onclick: function () { editing = true; render(); } })]);
    }
    var note = h("span", { "class": "note", role: "status", "aria-live": "polite", text: "Click any outlined text to edit it." });
    var saveBtn = h("button", { "class": "btn primary small", type: "button", text: "Save and publish", onclick: function () { save(saveBtn, note); } });
    var cancel = h("button", { "class": "btn small", type: "button", text: "Discard changes", onclick: function () {
      state = JSON.parse(JSON.stringify(saved)); editing = false; render();
    } });
    return h("div", { "class": "editbar" }, [note, cancel, saveBtn]);
  }

  /* copy edited text from the page into state */
  function sync() {
    document.querySelectorAll("[data-path][contenteditable]").forEach(function (el) {
      setP(state, el.dataset.path, el.textContent.replace(/\s+/g, " ").trim());
    });
    document.querySelectorAll("[data-csv][contenteditable]").forEach(function (el) {
      setP(state, el.dataset.csv, el.textContent.split(",").map(function (s) { return s.trim(); }).filter(Boolean));
    });
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function buildDoc() {
    var S = "scr" + "ipt";
    var reset = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
    var json = JSON.stringify(state, null, 2).replace(/</g, "\\u003c");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + reset + "</style></head><body>" +
      "<title>" + esc(state.name || "Portfolio") + "</title>\n" +
      "<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">\n" +
      "<style id=\"site-style\">" + document.getElementById("site-style").textContent + "</style>\n\n<div id=\"app\"></div>\n\n" +
      "<" + S + " type=\"application/json\" id=\"site-data\">\n" + json + "\n</" + S + ">\n\n" +
      "<" + S + " id=\"site-app\">" + document.getElementById("site-app").textContent + "</" + S + ">\n" +
      "</body></html>";
  }

  function save(btn, note) {
    sync();
    btn.disabled = true;
    btn.textContent = "";
    btn.appendChild(h("span", { "class": "spinner", "aria-hidden": "true" }));
    btn.appendChild(document.createTextNode("Publishing…"));
    note.className = "note"; note.textContent = "Saving a new version";
    artifactApi.publish(buildDoc()).then(function () {
      note.textContent = "Published. Reloading…";
    }, function (err) {
      var code = err && err.code;
      btn.disabled = false; btn.textContent = "Save and publish";
      note.className = "note err";
      if (code === "conflict") note.textContent = "A newer version was published. The page is reloading to it.";
      else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled") note.textContent = "This view is read-only. Open the site from your Claude account to edit.";
      else if (code === "rate_limited") note.textContent = "Saving too often. Wait a minute, then save again.";
      else if (code === "too_large") note.textContent = "The page is too large to save. Shorten some text and try again.";
      else note.textContent = "Couldn't publish. Check your connection and try again.";
    });
  }

  /* ---------- render ---------- */
  function render() {
    galleryCleanups.forEach(function (f) { f(); }); galleryCleanups = [];
    var app = document.getElementById("app");
    var y = window.scrollY;
    app.innerHTML = "";
    document.body.classList.toggle("editing", editing);
    [nav(), h("main", { id: "main" }, [
      hero(), about(), skills(), projects(),
      timeline("experience", "Experience", "experience", { role: "Role", org: "Company", period: "2027", desc: "", points: ["What you did and the result."] }),
      timeline("leadership", "Leadership", "leadership", { role: "Role", org: "Organization", period: "2027", desc: "", points: ["What you led and the result."] }),
      (state.volunteering && (state.volunteering.length || editing)) ? timeline("volunteering", "Volunteering", "volunteering", { role: "Role", org: "Organization", period: "2027", desc: "", points: ["What you did and the impact."] }) : null,
      resume(), contact()
    ]), footer(), editbar()].forEach(function (n) { if (n) app.appendChild(n); });
    var ct = document.getElementById("contact-title");
    if (ct) { ct.textContent = state.contact.heading || ""; ct.dataset.path = "contact.heading"; }
    if (editing) {
      document.querySelectorAll("[data-path], [data-csv]").forEach(function (el) {
        el.setAttribute("contenteditable", "true");
        el.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); el.blur(); } });
        el.addEventListener("paste", function (ev) {
          ev.preventDefault();
          var txt = (ev.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
          document.execCommand("insertText", false, txt);
        });
      });
    }
    window.scrollTo(0, y);
  }

  render();

  /* show editing only to people who can edit this site */
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (d) { if (d) { downloadsApi = d; render(); } }).catch(function () {});
    Promise.all([window.claude.use("artifact"), window.claude.use("user"), window.claude.use("assets")]).then(function (r) {
      artifactApi = r[0]; assetsApi = r[2];
      var user = r[1];
      if (!artifactApi || !user) return;
      return user.canEdit().then(function (ok) { if (ok) { canEdit = true; render(); } });
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
